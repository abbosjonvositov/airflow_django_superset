events {}

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name vardera.live www.vardera.live;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name vardera.live www.vardera.live;

        ssl_certificate /etc/letsencrypt/live/vardera.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vardera.live/privkey.pem;

        # Optional security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;

        # Serve static files
        location /static/ {
            alias /static/;
            autoindex off;
            access_log on;
            expires 30d;
        }

        # Django app reverse proxy
        location / {
            proxy_pass http://django_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Superset (on separate port or container, e.g., 8088)
        location /superset/ {
            proxy_pass http://localhost:8088/superset/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
